# Локальное переопределение для Docker Compose — НЕ коммитится (исключён в .git/info/exclude).
# Нужно, чтобы dev-сервер был доступен с телефона в локальной сети.
# В проде используется базовый compose.yaml с привязкой к 127.0.0.1.
services:
  nuxt-dev:
    ports: !override
      - "0.0.0.0:${FRONTEND_PORT:-3000}:3000"
