services:
  nuxt-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    develop:
      watch:
        - path: .
          action: sync
          target: /app/
        - path: package.json
          action: rebuild
        - path: pnpm-lock.yaml
          action: rebuild
